[SERVICE]
    Flush 1
    Log_Level info
    Parsers_File parsers.conf
[INPUT]
    Name tail
    Path /logs/*.log
    Tag spa
    Parser json
    Read_from_Head true
    Refresh_Interval 5
    Mem_Buf_Limit 10MB
[OUTPUT]
    Name loki
    Match spa
    Host loki
    Port 3100
    Labels job=spa
    Retry_Limit False
