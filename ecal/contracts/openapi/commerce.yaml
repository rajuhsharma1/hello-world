openapi: 3.1.0
info:
  title: Enterprise Commerce Architecture Lab — Phase 2
  version: 0.2.0
  description: |
    A loopback-only learning lab, not an authenticated commerce service.
    Prices and payment effects are simulated in INR. Each checkout contains
    one product. All reads use the same server-selected demonstration buyer.
    Payment outcomes are deterministic and no external provider is called.
servers:
  - url: /
tags:
  - name: Catalog
  - name: Orders
paths:
  /api/catalog/products/page:
    get:
      tags: [Catalog]
      operationId: pageProducts
      summary: Keyset catalog page ordered by name then UUID
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Items and opaque nextCursor; null means no more items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/orders/page:
    get:
      tags: [Orders]
      operationId: pageOrders
      summary: Read projection ordered by createdAt descending then UUID descending
      description: Cursor belongs to its status filter. The server selects the buyer. Pages are not a multi-request database snapshot.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: status
          schema:
            type: string
            enum: [ALL, CONFIRMED, CANCELLED]
            default: ALL
      responses:
        '200':
          description: At most limit orders and an opaque next cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/catalog/import:
    post:
      tags: [Catalog]
      operationId: importCatalog
      summary: Bounded synchronous create-only CSV import with independent batch transactions
      description: |
        UTF-8 RFC4180 CSV, at most 256 KiB and 1000 rows. Exact headers are
        productId,name,description,price,currency,stock. Name is nonblank and at most
        120 characters; description at most 500; positive numeric(12,2) price;
        currency INR; stock 0–1000000. UUIDs must be unique within the file.
        Structural errors reject the whole file before writes. Business validation or
        existing-ID conflicts roll back the affected batch of 50, while other batches
        commit. HTTP 200 can represent partial failure: inspect failedBatches.
        Replay identical original product data to skip existing imports without
        resetting stock. Infrastructure/commit uncertainty reports UNKNOWN, counted in failedBatches; created/skipped count only acknowledged commits. A timeout can leave committed batches; replay the file.
        One file per process, four workers, at most twenty batches. Not a durable job API.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: All batch outcomes, including partial failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '413':
          description: File or request exceeds upload limit
        '429':
          description: Another import is running in this process; retry later
  /api/catalog/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Browse the demonstration catalog and current stock
      description: Stock is a point-in-time hint, not a reservation guarantee.
      responses:
        '200':
          description: Products and decimal-string prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Latest 50 orders for the fixed demonstration buyer
      responses:
        '200':
          description: Newest orders first; this bounded history is not a paginated enterprise query API
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/Order'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place or replay a single-product simulated checkout
      description: |
        The key is a UUID. A committed key with the same product, quantity and
        requested payment outcome returns the original order without reserving
        stock or creating another payment/notification. A changed payload with
        that key is a conflict. Rejected validation/stock requests do not retain
        a committed claim. After a lost response, retry the identical payload
        with the same key; do not invent a new key to resolve uncertainty.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Logical checkout identity; not an authentication credential
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout'
      responses:
        '201':
          description: Newly committed order, including a persisted simulated decline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Existing order returned for an identical committed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Insufficient stock or key reused with a different payload; no new committed effects
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Read persisted status for the demonstration buyer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Persisted order snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
components:
  parameters:
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      in: query
      name: cursor
      description: Opaque versioned continuation token from the same endpoint and filter; never an authorization credential
      schema:
        type: string
        maxLength: 1024
  responses:
    InternalError:
      description: Unexpected failure; do not assume a new logical checkout is safe after an unknown HTTP result
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StorageUnavailable:
      description: Database operation could not complete; retry the identical checkout/key to resolve uncertainty
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidRequest:
      description: Invalid JSON, UUID, missing header, quantity or simulator choice
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Product or demonstration-buyer order not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ProductPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Product'
        nextCursor:
          type: [string, 'null']
    OrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Order'
        nextCursor:
          type: [string, 'null']
    ImportResult:
      type: object
      required: [totalRows, created, skipped, committedBatches, failedBatches, batches]
      properties:
        totalRows: {type: integer, minimum: 1, maximum: 1000}
        created: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        committedBatches: {type: integer, minimum: 0, maximum: 20}
        failedBatches: {type: integer, minimum: 0, maximum: 20}
        batches:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ImportBatch'
    ImportBatch:
      type: object
      required: [index, status, rows, created, skipped, error]
      properties:
        index: {type: integer, minimum: 1, maximum: 20}
        status: {type: string, enum: [COMMITTED, ROLLED_BACK, UNKNOWN]}
        rows: {type: integer, minimum: 1, maximum: 50}
        created: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        error: {type: [string, 'null']}
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      examples: ['1299.00']
      description: Exact decimal string. Clients must not use a floating-point total as payment authority.
    Product:
      type: object
      required: [id, name, description, price, currency, availableStock]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          const: INR
        availableStock:
          type: integer
          minimum: 0
    Checkout:
      type: object
      additionalProperties: false
      required: [productId, quantity, paymentOutcome]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        paymentOutcome:
          type: string
          enum: [APPROVE, DECLINE]
    Order:
      type: object
      required: [id, productId, productName, quantity, unitPrice, totalAmount, currency, status, paymentStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
          description: Name snapshot at checkout; future catalog changes do not rewrite history
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        unitPrice:
          $ref: '#/components/schemas/Money'
        totalAmount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          const: INR
        status:
          type: string
          enum: [CONFIRMED, CANCELLED]
          description: Intermediate states exist inside the transaction and are not exposed as committed work
        paymentStatus:
          type: string
          enum: [AUTHORIZED, DECLINED]
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [title, status, detail, instance, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable application error code; clients should not parse human-readable prose
