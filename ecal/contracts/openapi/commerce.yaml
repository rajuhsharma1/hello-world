openapi: 3.1.0
info:
  title: Enterprise Commerce Architecture Lab — Phase 1
  version: 0.1.0
  description: |
    A loopback-only learning lab, not an authenticated commerce service.
    Prices and payment effects are simulated in INR. Each checkout contains
    one product. All reads use the same server-selected demonstration buyer.
    Payment outcomes are deterministic and no external provider is called.
servers:
  - url: /
tags:
  - name: Catalog
  - name: Orders
paths:
  /api/catalog/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Browse the demonstration catalog and current stock
      description: Stock is a point-in-time hint, not a reservation guarantee.
      responses:
        '200':
          description: Products and decimal-string prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Latest 50 orders for the fixed demonstration buyer
      responses:
        '200':
          description: Newest orders first; this bounded history is not a paginated enterprise query API
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/Order'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place or replay a single-product simulated checkout
      description: |
        The key is a UUID. A committed key with the same product, quantity and
        requested payment outcome returns the original order without reserving
        stock or creating another payment/notification. A changed payload with
        that key is a conflict. Rejected validation/stock requests do not retain
        a committed claim. After a lost response, retry the identical payload
        with the same key; do not invent a new key to resolve uncertainty.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Logical checkout identity; not an authentication credential
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout'
      responses:
        '201':
          description: Newly committed order, including a persisted simulated decline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Existing order returned for an identical committed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Insufficient stock or key reused with a different payload; no new committed effects
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Read persisted status for the demonstration buyer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Persisted order snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
components:
  responses:
    InternalError:
      description: Unexpected failure; do not assume a new logical checkout is safe after an unknown HTTP result
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StorageUnavailable:
      description: Database operation could not complete; retry the identical checkout/key to resolve uncertainty
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidRequest:
      description: Invalid JSON, UUID, missing header, quantity or simulator choice
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Product or demonstration-buyer order not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      examples: ['1299.00']
      description: Exact decimal string. Clients must not use a floating-point total as payment authority.
    Product:
      type: object
      required: [id, name, description, price, currency, availableStock]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          const: INR
        availableStock:
          type: integer
          minimum: 0
    Checkout:
      type: object
      additionalProperties: false
      required: [productId, quantity, paymentOutcome]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        paymentOutcome:
          type: string
          enum: [APPROVE, DECLINE]
    Order:
      type: object
      required: [id, productId, productName, quantity, unitPrice, totalAmount, currency, status, paymentStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
          description: Name snapshot at checkout; future catalog changes do not rewrite history
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        unitPrice:
          $ref: '#/components/schemas/Money'
        totalAmount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          const: INR
        status:
          type: string
          enum: [CONFIRMED, CANCELLED]
          description: Intermediate states exist inside the transaction and are not exposed as committed work
        paymentStatus:
          type: string
          enum: [AUTHORIZED, DECLINED]
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [title, status, detail, instance, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable application error code; clients should not parse human-readable prose
