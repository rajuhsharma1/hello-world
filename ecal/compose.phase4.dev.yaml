# Optional loopback ports for Java services launched from IntelliJ.
services:
  orders-db:
    ports:
    - 127.0.0.1:5555:5432
  inventory-db:
    ports:
    - 127.0.0.1:5556:5432
  payment-db:
    ports:
    - 127.0.0.1:5557:5432
  reporting-db:
    ports:
    - 127.0.0.1:5558:5432
  kafka:
    ports:
    - 127.0.0.1:9094:9094
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
