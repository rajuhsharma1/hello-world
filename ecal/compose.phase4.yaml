# Phase 4 uses its own project, volumes and browser port.
name: ecal-phase4
x-health:
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 15s
x-app:
  restart: unless-stopped
  healthcheck: &id001
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 15s
    test:
    - CMD-SHELL
    - wget -Y off -q -O /dev/null http://127.0.0.1:8080/actuator/health
services:
  orders-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${ECAL_PHASE4_ORDERS_PASSWORD:-orders_dev_only}
    volumes:
    - orders-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
      test:
      - CMD-SHELL
      - pg_isready -U orders -d orders
  inventory-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${ECAL_PHASE4_INVENTORY_PASSWORD:-inventory_dev_only}
    volumes:
    - inventory-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
      test:
      - CMD-SHELL
      - pg_isready -U inventory -d inventory
  payment-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${ECAL_PHASE4_PAYMENT_PASSWORD:-payment_dev_only}
    volumes:
    - payment-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
      test:
      - CMD-SHELL
      - pg_isready -U payment -d payment
  inventory:
    restart: unless-stopped
    healthcheck: *id001
    build:
      context: backend/distributed
      args:
        SERVICE: inventory-service
    environment:
      ECAL_DB_URL: jdbc:postgresql://inventory-db:5432/inventory
      ECAL_DB_USER: inventory
      ECAL_DB_PASSWORD: ${ECAL_PHASE4_INVENTORY_PASSWORD:-inventory_dev_only}
      ECAL_BIND_ADDRESS: 0.0.0.0
      SERVER_PORT: '8080'
      ECAL_EVENTS_ENABLED: 'true'
      ECAL_KAFKA_BOOTSTRAP: kafka:9092
      ECAL_FLYWAY_LOCATIONS: classpath:db/inventory,classpath:db/events,classpath:db/events-inventory
    depends_on:
      inventory-db:
        condition: service_healthy
  payment:
    restart: unless-stopped
    healthcheck: *id001
    build:
      context: backend/distributed
      args:
        SERVICE: payment-service
    environment:
      ECAL_DB_URL: jdbc:postgresql://payment-db:5432/payment
      ECAL_DB_USER: payment
      ECAL_DB_PASSWORD: ${ECAL_PHASE4_PAYMENT_PASSWORD:-payment_dev_only}
      ECAL_BIND_ADDRESS: 0.0.0.0
      SERVER_PORT: '8080'
      ECAL_EVENTS_ENABLED: 'true'
      ECAL_KAFKA_BOOTSTRAP: kafka:9092
      ECAL_FLYWAY_LOCATIONS: classpath:db/payment,classpath:db/events,classpath:db/events-payment
    depends_on:
      payment-db:
        condition: service_healthy
  api:
    restart: unless-stopped
    healthcheck: *id001
    build:
      context: backend/distributed
      args:
        SERVICE: orders-service
    environment:
      ECAL_DB_URL: jdbc:postgresql://orders-db:5432/orders
      ECAL_DB_USER: orders
      ECAL_DB_PASSWORD: ${ECAL_PHASE4_ORDERS_PASSWORD:-orders_dev_only}
      ECAL_INVENTORY_URL: http://inventory:8080
      ECAL_PAYMENT_URL: http://payment:8080
      ECAL_BIND_ADDRESS: 0.0.0.0
      SERVER_PORT: '8080'
      ECAL_EVENTS_ENABLED: 'true'
      ECAL_KAFKA_BOOTSTRAP: kafka:9092
      ECAL_FLYWAY_LOCATIONS: classpath:db/orders,classpath:db/events,classpath:db/events-orders
    depends_on:
      orders-db:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infrastructure/local/web.Dockerfile
      args:
        VITE_ECAL_MODE: events
        NGINX_CONFIG: infrastructure/local/nginx.phase4.conf
    ports:
    - 127.0.0.1:8095:8080
    depends_on:
      api:
        condition: service_healthy
      reporting:
        condition: service_healthy
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
      test:
      - CMD-SHELL
      - wget -Y off -q -O /dev/null http://127.0.0.1:8080/healthz
  reporting-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: reporting
      POSTGRES_USER: reporting
      POSTGRES_PASSWORD: ${ECAL_PHASE4_REPORTING_PASSWORD:-reporting_dev_only}
    volumes:
    - reporting-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U reporting -d reporting
      interval: 5s
      timeout: 3s
      retries: 30
  reporting:
    restart: unless-stopped
    build:
      context: backend/distributed
      args:
        SERVICE: reporting-service
    environment:
      ECAL_DB_URL: jdbc:postgresql://reporting-db:5432/reporting
      ECAL_DB_USER: reporting
      ECAL_DB_PASSWORD: ${ECAL_PHASE4_REPORTING_PASSWORD:-reporting_dev_only}
      ECAL_EVENTS_ENABLED: 'true'
      ECAL_KAFKA_BOOTSTRAP: kafka:9092
      ECAL_BIND_ADDRESS: 0.0.0.0
      SERVER_PORT: '8080'
    depends_on:
      reporting-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -Y off -q -O /dev/null http://127.0.0.1:8080/actuator/health
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
  kafka:
    image: apache/kafka:3.9.1
    user: 0:0
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_NUM_PARTITIONS: '4'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: '168'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_SEGMENT_BYTES: '1048576'
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: '1'
      KAFKA_OFFSETS_TOPIC_SEGMENT_BYTES: '1048576'
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
volumes:
  orders-data: null
  inventory-data: null
  payment-data: null
  reporting-data: null
  kafka-data: null
