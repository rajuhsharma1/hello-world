server {
    listen 8080;
    server_name localhost;
    # Container IPs can change after a stop/start. Resolve service names at request time.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $orders_upstream api:8080;
    set $reporting_upstream reporting:8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control no-store always;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/catalog/import {
        client_max_body_size 300k;
        proxy_pass http://$orders_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_next_upstream off;
    }
    location /api/v1/reports/ {
        proxy_pass http://$reporting_upstream;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
    }
    location /api/ {
        proxy_pass http://$orders_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        # Retrying POST at the proxy can obscure outcomes. Only the buyer replays the exact key/payload.
        proxy_next_upstream off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
