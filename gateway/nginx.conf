limit_req_zone $binary_remote_addr zone=ark_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ark_public:10m rate=6r/m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index visit.html;
    server_tokens off;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Grafana supplies its own security policy and requires its own asset behavior.

    location = /api/auth/login { limit_req zone=ark_login burst=20 nodelay; limit_req_status 429; proxy_pass http://auth-service:8083; include /etc/nginx/proxy_params_spa; }
    location = /api/auth/setup { limit_req zone=ark_login burst=10 nodelay; limit_req_status 429; proxy_pass http://auth-service:8083; include /etc/nginx/proxy_params_spa; }
    location /api/auth/ { proxy_pass http://auth-service:8083; include /etc/nginx/proxy_params_spa; }
    location = /_auth_monitor {
        internal;
        proxy_pass http://auth-service:8083/internal/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Ark-Internal-Key ${ARK_INTERNAL_KEY};
        proxy_set_header X-Ark-Path /_monitoring;
        proxy_set_header X-Ark-Method GET;
    }
    location = /api/public/enquiries { limit_req zone=ark_public burst=6 nodelay; limit_req_status 429; proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/public/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/website/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/statistics { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /mailbox/ { auth_request /_auth_monitor; limit_except GET HEAD { deny all; } proxy_pass http://mailpit:8025; include /etc/nginx/proxy_params_spa; }
    location = /visit { return 302 /visit.html; }
    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/appointments { proxy_pass http://booking-service:8080; include /etc/nginx/proxy_params_spa; }
    location /api/appointments/ { proxy_pass http://booking-service:8080; include /etc/nginx/proxy_params_spa; }
    location = /api/notifications { proxy_pass http://notification-service:8081; include /etc/nginx/proxy_params_spa; }
    location = /api/staff { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/attendance { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/sales { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/operations/settings { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/staff/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/contracts { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/contracts/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/salaries { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/salaries/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/expenses { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/contacts { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/contacts/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/reports/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /ops/operations/health { auth_request /_auth_monitor; limit_except GET HEAD { deny all; } proxy_pass http://operations-service:8082/actuator/health; include /etc/nginx/proxy_params_spa; }
    location = /ops/booking/health { auth_request /_auth_monitor; limit_except GET HEAD { deny all; } proxy_pass http://booking-service:8080/actuator/health; include /etc/nginx/proxy_params_spa; }
    location = /ops/notification/health { auth_request /_auth_monitor; limit_except GET HEAD { deny all; } proxy_pass http://notification-service:8081/actuator/health; include /etc/nginx/proxy_params_spa; }
    location /ops/zipkin/ { auth_request /_auth_monitor; limit_except GET HEAD { deny all; } proxy_pass http://zipkin:9411/; include /etc/nginx/proxy_params_spa; }
    location /ops/loki/ { auth_request /_auth_monitor; limit_except GET HEAD { deny all; } proxy_pass http://loki:3100/; include /etc/nginx/proxy_params_spa; }
    location = /grafana { return 302 /grafana/; }
    location /grafana/ {
        auth_request /_auth_monitor;
        proxy_pass http://grafana:3000;
        include /etc/nginx/proxy_params_spa;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /api/ { return 404; }
    location /ops/ { return 404; }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self' https:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always;
        add_header Cache-Control no-cache;
        try_files $uri $uri/ =404;
    }
}
