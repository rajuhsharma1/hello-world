server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Grafana supplies its own security policy and requires its own asset behavior.

    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/appointments { proxy_pass http://booking-service:8080; include /etc/nginx/proxy_params_spa; }
    location /api/appointments/ { proxy_pass http://booking-service:8080; include /etc/nginx/proxy_params_spa; }
    location = /api/notifications { proxy_pass http://notification-service:8081; include /etc/nginx/proxy_params_spa; }
    location = /api/staff { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/attendance { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/sales { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/operations/settings { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/staff/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/contracts { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/contracts/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/salaries { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/salaries/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/expenses { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /api/contacts { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/contacts/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location /api/reports/ { proxy_pass http://operations-service:8082; include /etc/nginx/proxy_params_spa; }
    location = /ops/operations/health { proxy_pass http://operations-service:8082/actuator/health; include /etc/nginx/proxy_params_spa; }
    location = /ops/booking/health { proxy_pass http://booking-service:8080/actuator/health; include /etc/nginx/proxy_params_spa; }
    location = /ops/notification/health { proxy_pass http://notification-service:8081/actuator/health; include /etc/nginx/proxy_params_spa; }
    location /ops/zipkin/ { proxy_pass http://zipkin:9411/; include /etc/nginx/proxy_params_spa; }
    location /ops/loki/ { proxy_pass http://loki:3100/; include /etc/nginx/proxy_params_spa; }
    location = /grafana { return 302 /grafana/; }
    location /grafana/ {
        proxy_pass http://grafana:3000;
        include /etc/nginx/proxy_params_spa;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /api/ { return 404; }
    location /ops/ { return 404; }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always;
        add_header Cache-Control no-cache;
        try_files $uri $uri/ =404;
    }
}
