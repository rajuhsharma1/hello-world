spring:
  application:
    name: operations-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/spa}
    username: ${DB_USER:spa}
    password: ${DB_PASSWORD:spa_dev_only}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: 8082
spa:
  zone: ${SPA_ZONE:Asia/Kolkata}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging:
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: ${spring.application.name}

ark:
  auth-url: ${ARK_AUTH_URL:http://localhost:8083}
  internal-key: ${ARK_INTERNAL_KEY}

  public-origin: ${ARK_PUBLIC_ORIGIN:http://localhost:8080}
  mail-from: ${SMTP_FROM:website@ark.local}
