# The gateway is the only published port. Backends and infrastructure stay internal.
services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      ARK_INTERNAL_KEY: ${ARK_INTERNAL_KEY:?Run python3 scripts/setup-security.py first}
      NGINX_ENVSUBST_FILTER: ^ARK_INTERNAL_KEY$
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      - auth-service
      - booking-service
      - notification-service
      - operations-service
      - grafana
      - zipkin
      - loki
  auth-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: spa
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spa_dev_only}
    volumes: ["auth-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa -d spa"]
      interval: 5s
      timeout: 3s
      retries: 20
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/spa
      DB_PASSWORD: ${DB_PASSWORD:-spa_dev_only}
      ARK_INTERNAL_KEY: ${ARK_INTERNAL_KEY:?Run python3 scripts/setup-security.py first}
      ARK_SETUP_TOKEN: ${ARK_SETUP_TOKEN:-}
      ARK_PUBLIC_ORIGIN: ${ARK_PUBLIC_ORIGIN:-http://localhost:8080}
      ARK_COOKIE_SECURE: ${ARK_COOKIE_SECURE:-false}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGGING_FILE_NAME: /logs/auth.log
    volumes: ["app-logs:/logs"]
    depends_on:
      storage-init: {condition: service_completed_successfully}
      auth-db: {condition: service_healthy}
  booking-db:
    image: postgres:17.6
    environment: &db-env
      POSTGRES_DB: spa
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spa_dev_only}
    volumes: ["booking-data:/var/lib/postgresql/data"]
    healthcheck: &db-health
      test: ["CMD-SHELL", "pg_isready -U spa -d spa"]
      interval: 5s
      timeout: 3s
      retries: 20
  notification-db:
    image: postgres:17.6
    environment: *db-env
    volumes: ["notification-data:/var/lib/postgresql/data"]
    healthcheck: *db-health
  operations-db:
    image: postgres:17.6
    environment: *db-env
    volumes: ["operations-data:/var/lib/postgresql/data"]
    healthcheck: *db-health
  operations-service:
    build:
      context: .
      dockerfile: operations-service/Dockerfile
    environment:
      ARK_AUTH_URL: http://auth-service:8083
      ARK_INTERNAL_KEY: ${ARK_INTERNAL_KEY:?Run python3 scripts/setup-security.py first}
      DB_URL: jdbc:postgresql://operations-db:5432/spa
      DB_PASSWORD: ${DB_PASSWORD:-spa_dev_only}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGGING_FILE_NAME: /logs/operations.log
      SPA_ZONE: ${SPA_ZONE:-Asia/Kolkata}
    volumes: ["app-logs:/logs"]
    depends_on:
      storage-init: {condition: service_completed_successfully}
      operations-db: {condition: service_healthy}
  storage-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /data && chown 10001:10001 /logs"]
    volumes: ["kafka-data:/data", "app-logs:/logs"]
  kafka:
    depends_on:
      storage-init: {condition: service_completed_successfully}
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
  zipkin:
    image: openzipkin/zipkin:3.5
  loki:
    image: grafana/loki:3.5.7
    command: -config.file=/etc/loki/local-config.yaml
    volumes: ["loki-data:/loki"]
  fluent-bit:
    image: fluent/fluent-bit:4.0.11
    environment:
      NO_PROXY: localhost,127.0.0.1,loki
      no_proxy: localhost,127.0.0.1,loki
    volumes:
      - ./infra/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - app-logs:/logs:ro
    depends_on: [loki]
  grafana:
    image: grafana/grafana:12.2.1
    environment:
      NO_PROXY: localhost,127.0.0.1,loki,zipkin
      no_proxy: localhost,127.0.0.1,loki,zipkin
      GF_SERVER_ROOT_URL: http://localhost:8080/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run python3 scripts/setup-security.py first}
    volumes:
      - ./infra/datasources.yml:/etc/grafana/provisioning/datasources/spa.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki]
  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      ARK_AUTH_URL: http://auth-service:8083
      ARK_INTERNAL_KEY: ${ARK_INTERNAL_KEY:?Run python3 scripts/setup-security.py first}
      DB_URL: jdbc:postgresql://booking-db:5432/spa
      DB_PASSWORD: ${DB_PASSWORD:-spa_dev_only}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGGING_FILE_NAME: /logs/booking.log
    volumes: ["app-logs:/logs"]
    depends_on:
      storage-init: {condition: service_completed_successfully}
      booking-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      ARK_AUTH_URL: http://auth-service:8083
      ARK_INTERNAL_KEY: ${ARK_INTERNAL_KEY:?Run python3 scripts/setup-security.py first}
      DB_URL: jdbc:postgresql://notification-db:5432/spa
      DB_PASSWORD: ${DB_PASSWORD:-spa_dev_only}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGGING_FILE_NAME: /logs/notification.log
    volumes: ["app-logs:/logs"]
    depends_on:
      storage-init: {condition: service_completed_successfully}
      notification-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
volumes:
  auth-data:
  operations-data:
  booking-data:
  notification-data:
  kafka-data:
  loki-data:
  grafana-data:
  app-logs:
